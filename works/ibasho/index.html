<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IBASHO ランチプラン｜ポートフォリオ</title>
<style>
  :root { color-scheme: light dark; --page: #f2f2ef; --surface: #fff; --ink: #18201d; --muted: #68706b; --line: #d8ddd8; --accent: #1c5141; }
  @media (prefers-color-scheme: dark) { :root { --page: #121614; --surface: #1d2420; --ink: #f1f4ef; --muted: #b4bcb5; --line: #39443d; --accent: #a6d5b5; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 16px/1.7 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { width: min(100% - 32px, 940px); margin: 0 auto; padding: 36px 0 64px; }
  a { color: inherit; }
  .back { color: var(--muted); font-size: .9rem; text-underline-offset: .25em; }
  header { margin: 30px 0 24px; }
  .eyebrow { margin: 0 0 8px; color: var(--accent); font-size: .78rem; font-weight: 700; letter-spacing: .1em; }
  h1 { margin: 0; font-size: clamp(1.7rem, 5vw, 2.7rem); letter-spacing: -.03em; line-height: 1.25; }
  .lede { max-width: 48rem; color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 22px 0 28px; }
  .button { display: inline-block; padding: 9px 15px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); font-weight: 650; text-decoration: none; }
  .button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  figure { margin: 0; padding: clamp(8px, 2vw, 18px); border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
  figure img { display: block; width: 100%; height: auto; box-shadow: 0 3px 18px rgb(0 0 0 / .14); }
  figcaption { padding: 12px 4px 2px; color: var(--muted); font-size: .84rem; }
</style>
</head>
<body>
<main>
  <a class="back" href="../../">← ポートフォリオへ戻る</a>
  <header>
    <p class="eyebrow">INFORMATION DESIGN / A4 FLYER</p>
    <h1>お食事付き IBASHO プラン</h1>
    <p class="lede">ランチとホテル最上階ラウンジを組み合わせたプランの内容・価格・利用条件を、選べるレストランと比較できるよう一枚に整理したチラシです。</p>
  </header>
  <div class="actions">
    <a class="button primary" href="ibasho_lunch_flyer.pdf" target="_blank">PDFを開く</a>
    <a class="button" href="https://www.keioplaza.co.jp/event/ibashoplan/" target="_blank" rel="noopener">公式ページを見る</a>
  </div>
  <figure>
    <img src="ibasho_lunch_flyer.png" alt="お食事付きIBASHOプランのA4チラシ">
    <figcaption>掲載内容は制作時点の情報に基づくポートフォリオ作品です。</figcaption>
  </figure>
</main>
</body>
</html>
